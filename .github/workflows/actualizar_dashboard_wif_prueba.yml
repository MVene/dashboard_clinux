name: Actualizar dashboard Clinux (prueba WIF)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clinux-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Autenticar Google Cloud sin clave permanente
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'google-api-python-client>=2,<3' 'google-auth>=2,<3'

      - name: Descargar último respaldo con cuenta de servicio
        env:
          GCP_DRIVE_FOLDER_ID: ${{ vars.GCP_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GCP_DRIVE_FOLDER_ID" || { echo 'Falta GCP_DRIVE_FOLDER_ID'; exit 1; }
          python -m scripts.drive_wif \
            --folder-id "$GCP_DRIVE_FOLDER_ID" \
            --output "$RUNNER_TEMP/clinux_respaldo.sql"

      - name: Procesar respaldo y actualizar PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STOCK_ALERT_THRESHOLD: ${{ vars.STOCK_ALERT_THRESHOLD }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Falta DATABASE_URL'; exit 1; }
          python -m scripts.etl --file "$RUNNER_TEMP/clinux_respaldo.sql"

      - name: Borrar respaldo local temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/clinux_respaldo.sql" "$RUNNER_TEMP/clinux_respaldo.sql.partial"

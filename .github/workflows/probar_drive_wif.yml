
name: Probar acceso seguro a Drive

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Diagnosticar identidad de GitHub
        run: |
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Rama: $GITHUB_REF"

      - name: Autenticar Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar acceso a respaldos
        env:
          DRIVE_FOLDER_ID: ${{ vars.GCP_DRIVE_FOLDER_ID }}
        run: |
          pip install google-api-python-client google-auth
          python - <<'PY'
          import os
          import google.auth
          from googleapiclient.discovery import build

          folder = os.environ["DRIVE_FOLDER_ID"]
          creds, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          drive = build("drive", "v3", credentials=creds)

          result = drive.files().list(
              q=f"'{folder}' in parents and trashed = false",
              fields="nextPageToken,files(id,name)",
              pageSize=1000
          ).execute()

          files = result.get("files", [])
          sql_count = sum(
              f["name"].lower().endswith(".sql")
              for f in files
          )
          print(f"Respaldos SQL encontrados: {sql_count}")
          assert sql_count > 0, "No se encontraron respaldos SQL"
          PY

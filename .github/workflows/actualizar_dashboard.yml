name: Actualizar dashboard Clinux

on:
  workflow_dispatch:
  schedule:
    # 09:23, 12:23, 15:23 y 18:23 de Argentina (UTC-3)
    - cron: '23 12,15,18,21 * * *'

permissions:
  contents: read

concurrency:
  group: clinux-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Dependencias
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Configurar Drive privado
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_BASE64" ]; then echo 'Falta RCLONE_CONFIG_BASE64'; exit 1; fi
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
      - name: Procesar última copia y actualizar PostgreSQL
        env:
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER }}
          WHOLESALE_LISTS: ${{ vars.WHOLESALE_LISTS }}
          WHOLESALE_GROUPS: ${{ vars.WHOLESALE_GROUPS }}
          STOCK_ALERT_THRESHOLD: ${{ vars.STOCK_ALERT_THRESHOLD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.etl
